#
# Pull the rendered formula from the dev-prune repository.
#
# It pulls rather than being pushed to, deliberately: a push would need a cross-repository
# token stored as a secret in dev-prune, and the only thing that secret would ever do is
# copy a public file from one public repository to another. A scheduled fetch needs no
# credential at all, and `workflow_dispatch` makes it immediate when a release cannot wait
# for the next run.
name: Sync formula

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the rendered formula
        run: |
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/Life-Experimentalist/dev-prune/main/packaging/homebrew/dev-prune.rb \
            -o Formula/dev-prune.rb
          # A formula with no version line means the fetch produced something that is not
          # the formula — a 404 page, a truncated body. Committing that would break every
          # `brew upgrade` until someone noticed.
          grep -q '^  version "' Formula/dev-prune.rb

      - name: Commit if it changed
        run: |
          if git diff --quiet -- Formula/dev-prune.rb; then
            echo "Formula already matches upstream."
            exit 0
          fi
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/dev-prune.rb)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dev-prune.rb
          git commit -m "dev-prune ${version}"
          git push
